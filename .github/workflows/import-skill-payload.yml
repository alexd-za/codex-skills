name: Import skill payload

on:
  push:
    paths:
      - '.skill-payload/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract skill
        shell: bash
        run: |
          set -euo pipefail
          test -f .skill-payload/READY
          cat .skill-payload/chunks/*.b64 | base64 --decode > /tmp/fusion-cad-guardian.zip
          rm -rf skills/fusion-cad-guardian
          mkdir -p skills
          unzip -q /tmp/fusion-cad-guardian.zip -d skills
          test -f skills/fusion-cad-guardian/SKILL.md
          VERSION=$(cat .skill-payload/READY)
          rm -rf .skill-payload
          echo "SKILL_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Commit imported skill
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(fusion-cad-guardian): import ${SKILL_VERSION}" || exit 0
          git push
