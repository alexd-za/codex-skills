name: Apply Fusion CAD Guardian v2.2.0

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/fusion-cad-guardian-v2.2.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify and apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .release-patch/source-000
          cat .release-patch/source-* > /tmp/fusion-cad-guardian-v2.2.patch
          actual="$(sha256sum /tmp/fusion-cad-guardian-v2.2.patch | awk '{print $1}')"
          test "$actual" = "cc4e1855026125767c66b979159e85112108dd7831fb4775bd0132c42d52c964"
          git apply --check /tmp/fusion-cad-guardian-v2.2.patch
          git apply /tmp/fusion-cad-guardian-v2.2.patch
          rm -rf .release-patch
          rm -f release-notes-v2.2.0.tmp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: python -m compileall -q skills/fusion-cad-guardian/scripts skills/fusion-cad-guardian/tests

      - name: Unit tests
        run: python -m unittest discover -s skills/fusion-cad-guardian/tests -v

      - name: Built-in self-test
        run: python skills/fusion-cad-guardian/scripts/guardian.py self-test

      - name: Package diagnostics
        run: python skills/fusion-cad-guardian/scripts/guardian.py doctor

      - name: JSON Schema conformance
        shell: bash
        run: |
          python -m pip install "jsonschema>=4.23,<5"
          python skills/fusion-cad-guardian/tests/schema_conformance.py

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(fusion-cad-guardian): release v2.2.0"
          git push origin HEAD:release/fusion-cad-guardian-v2.2.0
